# MapProxy configuration of the better-maps imagery proxy.
#
# One layer "aerial" in WebMercator (XYZ, origin top left), served only as WMTS REST
# (/wmts/aerial/webmercator/{z}/{x}/{y}.jpeg) to the gateway on the internal network. MapProxy itself does not
# store tiles (disable_storage): the gateway caches what devices asked for, with a size and age limit. Nothing is
# seeded.
#
# Sources, bottom first (keep in sync with sources.json, which holds the attributions):
# - Sentinel-2 cloudless 2016 by EOX (CC BY 4.0) everywhere. Only the 2016 layer: the later years are CC BY-NC-SA.
# - State orthophotos (DOP) from zoom 12 (min_res), each clipped to its state polygon (coverage/*.geojson, built
#   from data/borders by scripts/make-coverages.sh), so that every tile comes from the right state.
#
# Politeness towards the state servers: at most 2 concurrent requests per server, 256 px tiles (no meta tiles),
# JPEG, an honest User-Agent without personal data, and the gateway limits the renderings to 4 at a time.

services:
  wmts:
    restful: true
    kvp: false

layers:
  - name: aerial
    title: Luftbild (better-maps)
    sources: [aerial]

caches:
  aerial:
    grids: [webmercator]
    sources: [s2cloudless, nw, rp, he, ni, by, bw, sl, th, sn, bb, be, sh]
    format: image/jpeg
    disable_storage: true
    meta_size: [1, 1]
    meta_buffer: 0

grids:
  webmercator:
    base: GLOBAL_WEBMERCATOR
    origin: nw
    num_levels: 20

globals:
  # The configuration is mounted read-only; locks (concurrent_requests across the gunicorn workers) go to a tmpfs.
  cache:
    base_dir: /tmp/mapproxy/cache_data
    lock_dir: /tmp/mapproxy/locks
    tile_lock_dir: /tmp/mapproxy/tile_locks
  image:
    resampling_method: bilinear
    formats:
      image/jpeg:
        encoding_options:
          jpeg_quality: 85
  http:
    client_timeout: 20
    hide_error_details: true
    headers:
      User-Agent: "better-maps-imagery-proxy/0.1 (self-hosted tile proxy of an open-source map app; low volume, cached)"

# The DOP sources: zoom 12 and up. min_res is in m/px of the WebMercator grid (zoom 12 = 38.2 m/px).
.dop: &dop
  type: wms
  supported_srs: ['EPSG:3857']
  supported_formats: ['image/jpeg']
  min_res: 40
  concurrent_requests: 2
  wms_opts:
    version: '1.3.0'

sources:
  s2cloudless:
    type: tile
    url: https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless_3857/default/GoogleMapsCompatible/%(z)s/%(y)s/%(x)s.jpg
    grid: webmercator
    concurrent_requests: 2

  nw:
    <<: *dop
    req: {url: 'https://www.wms.nrw.de/geobasis/wms_nw_dop', layers: nw_dop_rgb}
    coverage: {datasource: /mapproxy/config/coverage/nw.geojson, srs: 'EPSG:4326', clip: true}

  rp:
    <<: *dop
    req: {url: 'https://geo4.service24.rlp.de/wms/rp_dop20.fcgi', layers: rp_dop20}
    coverage: {datasource: /mapproxy/config/coverage/rp.geojson, srs: 'EPSG:4326', clip: true}

  he:
    <<: *dop
    req: {url: 'https://www.gds-srv.hessen.de/cgi-bin/lika-services/ogc-free-images.ows', layers: he_dop_rgb}
    coverage: {datasource: /mapproxy/config/coverage/he.geojson, srs: 'EPSG:4326', clip: true}

  ni:
    <<: *dop
    req: {url: 'https://opendata.lgln.niedersachsen.de/doorman/noauth/dop_wms', layers: ni_dop20}
    coverage: {datasource: /mapproxy/config/coverage/ni.geojson, srs: 'EPSG:4326', clip: true}

  by:
    <<: *dop
    req: {url: 'https://geoservices.bayern.de/od/wms/dop/v1/dop20', layers: by_dop20c}
    coverage: {datasource: /mapproxy/config/coverage/by.geojson, srs: 'EPSG:4326', clip: true}

  bw:
    <<: *dop
    req: {url: 'https://owsproxy.lgl-bw.de/owsproxy/ows/WMS_LGL-BW_ATKIS_DOP_20_C', layers: IMAGES_DOP_20_RGB}
    coverage: {datasource: /mapproxy/config/coverage/bw.geojson, srs: 'EPSG:4326', clip: true}

  sl:
    <<: *dop
    req: {url: 'https://geoportal.saarland.de/freewms/dop2023', layers: sl_dop20_rgb}
    wms_opts: {version: '1.1.1'}
    coverage: {datasource: /mapproxy/config/coverage/sl.geojson, srs: 'EPSG:4326', clip: true}

  th:
    <<: *dop
    req: {url: 'https://www.geoproxy.geoportal-th.de/geoproxy/services/DOP', layers: th_dop}
    coverage: {datasource: /mapproxy/config/coverage/th.geojson, srs: 'EPSG:4326', clip: true}

  sn:
    <<: *dop
    req: {url: 'https://geodienste.sachsen.de/wms_geosn_dop-rgb/guest', layers: sn_dop_020}
    coverage: {datasource: /mapproxy/config/coverage/sn.geojson, srs: 'EPSG:4326', clip: true}

  bb:
    <<: *dop
    req: {url: 'https://isk.geobasis-bb.de/mapproxy/dop20c/service/wms', layers: bebb_dop20c}
    coverage: {datasource: /mapproxy/config/coverage/bb.geojson, srs: 'EPSG:4326', clip: true}

  be:
    <<: *dop
    req: {url: 'https://gdi.berlin.de/services/wms/truedop_2025_sommer', layers: truedop_2025_sommer_rgb}
    coverage: {datasource: /mapproxy/config/coverage/be.geojson, srs: 'EPSG:4326', clip: true}

  sh:
    <<: *dop
    req: {url: 'https://service.gdi-sh.de/WMS_SH_DOP20col_OpenGBD', layers: sh_dop20_rgb}
    coverage: {datasource: /mapproxy/config/coverage/sh.geojson, srs: 'EPSG:4326', clip: true}
