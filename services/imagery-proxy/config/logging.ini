# MapProxy logging: errors only. Source requests (mapproxy.source.request) and warnings contain the URLs of the
# requests to the state servers and with them the map area a device looked at, so they are not logged.
[loggers]
keys=root,source_requests

[handlers]
keys=stderr

[formatters]
keys=default

[logger_root]
level=ERROR
handlers=stderr

[logger_source_requests]
level=CRITICAL
qualname=mapproxy.source.request
propagate=0
handlers=stderr

[handler_stderr]
class=StreamHandler
level=ERROR
formatter=default
args=(sys.stderr,)

[formatter_default]
format=%(asctime)s %(levelname)s %(name)s: %(message)s
